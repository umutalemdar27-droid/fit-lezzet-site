<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fit & Lezzet — Tarifler</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0D1210;
    --turuncu: #c44a1a;
    --yesil: #0aa35a;
    --pembe: #be146e;
    --mor: #7c3ab2;
    --neon-yesil: #0f9d58;
    --neon-mavi: #087e95;
  }
 
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { background:var(--bg); color:#F3F0E6; font-family:'Nunito',sans-serif; overflow-x:hidden; }
  section[id], div[id] { scroll-margin-top:90px; }
 
 
  /* CANVAS */
  #particle-canvas { position:fixed; inset:0; z-index:0; pointer-events:none; }
 
  @keyframes fadeUp{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}
  @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  @keyframes counterSpin{from{transform:rotate(0deg)}to{transform:rotate(-360deg)}}
  @keyframes floatBadge{0%,100%{transform:translateY(0px)}50%{transform:translateY(-8px)}}
  @keyframes tagPulse{0%,100%{box-shadow:0 0 15px rgba(15,157,88,0.1)}50%{box-shadow:0 0 30px rgba(15,157,88,0.3)}}
 
  @media(prefers-reduced-motion:reduce){
    *{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important;scroll-behavior:auto!important}
    #particle-canvas{display:none}
  }
 
  /* NAV */
  nav{display:flex;justify-content:space-between;align-items:center;padding:1.2rem 4rem;position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(13,18,16,0.85);backdrop-filter:blur(16px);border-bottom:1px solid rgba(10,163,90,0.1)}
  .logo{font-family:'Poppins',sans-serif;font-size:1.6rem;font-weight:900;letter-spacing:-1px}
  .logo-link{text-decoration:none;cursor:pointer;display:inline-block}
  .logo .fit{color:var(--turuncu);text-shadow:0 0 15px rgba(196,74,26,0.6)}
  .logo .amp{color:rgba(243,240,230,0.2)}
  .logo .lez{color:var(--neon-yesil);text-shadow:0 0 15px rgba(15,157,88,0.6)}
  nav ul{display:flex;gap:2rem;list-style:none}
  nav ul a{color:#F3F0E6;text-decoration:none;font-weight:700;font-size:0.9rem;opacity:0.5;transition:opacity 0.2s,color 0.2s,text-shadow 0.2s}
  nav ul a:hover{opacity:1;color:var(--neon-yesil);text-shadow:0 0 10px rgba(15,157,88,0.5)}
  nav ul a.active{opacity:1;color:var(--neon-yesil);text-shadow:0 0 10px rgba(15,157,88,0.5)}
  .nav-btn{background:transparent;color:var(--neon-yesil);border:1.5px solid var(--neon-yesil);padding:0.6rem 1.5rem;border-radius:50px;font-family:'Nunito',sans-serif;font-weight:800;font-size:0.88rem;transition:all 0.2s;box-shadow:0 0 12px rgba(15,157,88,0.2)}
  .nav-btn:hover{background:var(--neon-yesil);color:#0a0f0a;box-shadow:0 0 25px rgba(15,157,88,0.5)}
  .nav-toggle{display:none;flex-direction:column;gap:5px;background:transparent;border:none;padding:0.5rem}
  .nav-toggle span{width:24px;height:2px;background:var(--neon-yesil);box-shadow:0 0 6px rgba(15,157,88,0.5);transition:transform 0.25s,opacity 0.25s}
  .nav-toggle.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
  .nav-toggle.open span:nth-child(2){opacity:0}
  .nav-toggle.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
 
  /* HERO */
  .hero{min-height:100vh;display:flex;align-items:center;padding:8rem 4rem 4rem;position:relative;z-index:1}
  .hero-grid{display:grid;grid-template-columns:1.1fr 0.9fr;gap:4rem;align-items:center;max-width:1200px;margin:0 auto}
  .hero-text .tag{display:inline-flex;align-items:center;gap:0.4rem;background:rgba(15,157,88,0.08);color:var(--neon-yesil);border:1px solid rgba(15,157,88,0.25);padding:0.35rem 1rem;border-radius:50px;font-size:0.82rem;font-weight:800;margin-bottom:1.8rem;text-shadow:0 0 8px rgba(15,157,88,0.4);box-shadow:0 0 15px rgba(15,157,88,0.1);animation:tagPulse 2s ease-in-out infinite}
  .hero-text h1{font-family:'Poppins',sans-serif;font-size:clamp(2.8rem,5.5vw,4.8rem);font-weight:900;line-height:1.05;margin-bottom:1.5rem;letter-spacing:-2px}
  .hero-text h1 .t{color:var(--turuncu);text-shadow:0 0 20px rgba(196,74,26,0.5)}
  .hero-text h1 .y{color:var(--neon-yesil);text-shadow:0 0 20px rgba(15,157,88,0.5)}
  .hero-text p{font-size:1.05rem;color:rgba(243,240,230,0.55);line-height:1.8;margin-bottom:2.5rem;max-width:460px;font-weight:600}
  .hero-btns{display:flex;gap:1rem;flex-wrap:wrap}
  .btn-primary{background:var(--turuncu);color:white;padding:0.9rem 2rem;border-radius:50px;font-weight:800;font-size:1rem;text-decoration:none;transition:transform 0.2s,box-shadow 0.2s;box-shadow:0 0 25px rgba(196,74,26,0.4);display:inline-block}
  .btn-primary:hover{transform:translateY(-3px);box-shadow:0 0 40px rgba(196,74,26,0.6)}
  .btn-secondary{background:transparent;color:#F3F0E6;padding:0.9rem 2rem;border-radius:50px;font-weight:800;font-size:1rem;text-decoration:none;border:1.5px solid rgba(243,240,230,0.15);transition:all 0.2s;display:inline-block}
  .btn-secondary:hover{border-color:var(--neon-yesil);color:var(--neon-yesil);box-shadow:0 0 15px rgba(15,157,88,0.2)}
  .hero-cards{display:flex;flex-direction:column;gap:1rem;position:relative}
  .rotating-ring-wrap{position:absolute;top:-60px;right:-60px;width:200px;height:200px;z-index:0;pointer-events:none}
  .ring{position:absolute;border-radius:50%;border-style:solid;border-color:transparent;animation:spin linear infinite}
  .ring-1{inset:0;border-width:2px;border-top-color:rgba(15,157,88,0.6);border-right-color:rgba(15,157,88,0.2);animation-duration:8s;box-shadow:0 0 15px rgba(15,157,88,0.2)}
  .ring-2{inset:20px;border-width:1.5px;border-bottom-color:rgba(190,20,110,0.5);border-left-color:rgba(190,20,110,0.15);animation-duration:5s;animation-direction:reverse}
  .ring-3{inset:40px;border-width:1px;border-top-color:rgba(124,58,178,0.5);border-right-color:rgba(124,58,178,0.15);animation-duration:12s}
  .ring-dot{position:absolute;inset:55px;border-radius:50%;background:radial-gradient(circle,rgba(15,157,88,0.15),transparent);border:1px solid rgba(15,157,88,0.2);display:flex;align-items:center;justify-content:center;font-size:1.8rem;animation:counterSpin 8s linear infinite}
  .floating-badge{position:absolute;background:rgba(15,157,88,0.08);border:1px solid rgba(15,157,88,0.25);border-radius:50px;padding:0.4rem 0.9rem;font-size:0.78rem;font-weight:800;color:var(--neon-yesil);text-shadow:0 0 8px rgba(15,157,88,0.4);animation:floatBadge 3s ease-in-out infinite;backdrop-filter:blur(5px);white-space:nowrap}
  .fb-1{top:-20px;left:-30px;animation-delay:0s}
  .fb-2{bottom:10px;left:-40px;animation-delay:1s;background:rgba(196,74,26,0.08);border-color:rgba(196,74,26,0.25);color:var(--turuncu);text-shadow:0 0 8px rgba(196,74,26,0.4)}
  .hero-card{border-radius:24px;padding:1.6rem;position:relative;transition:transform 0.3s,box-shadow 0.3s;backdrop-filter:blur(10px);z-index:1}
  .hero-card:hover{transform:translateY(-5px)}
  .hc-fit{background:rgba(196,74,26,0.07);border:1.5px solid rgba(196,74,26,0.25);box-shadow:0 0 30px rgba(196,74,26,0.1),inset 0 0 30px rgba(196,74,26,0.03)}
  .hc-fit:hover{box-shadow:0 0 50px rgba(196,74,26,0.25)}
  .hc-yem{background:rgba(15,157,88,0.06);border:1.5px solid rgba(15,157,88,0.2);box-shadow:0 0 30px rgba(15,157,88,0.08),inset 0 0 30px rgba(15,157,88,0.03)}
  .hc-yem:hover{box-shadow:0 0 50px rgba(15,157,88,0.2)}
  .hc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:0.8rem}
  .hc-emoji{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;background:rgba(243,240,230,0.05);border:1px solid rgba(243,240,230,0.08)}
  .play-circle{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.85rem;color:white;font-weight:800}
  .play-t{background:var(--turuncu);box-shadow:0 0 15px rgba(196,74,26,0.5)}
  .play-y{background:var(--neon-yesil);color:#0a0f0a;box-shadow:0 0 15px rgba(15,157,88,0.5)}
  .hc-label{font-size:0.72rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;opacity:0.4;margin-bottom:0.3rem}
  .hc-title{font-family:'Poppins',sans-serif;font-size:1.05rem;font-weight:800;letter-spacing:-0.5px}
  .hc-meta{font-size:0.8rem;font-weight:700;opacity:0.4;margin-top:0.5rem}
 
  /* KÜP VİTRİNİ (3D showcase) */
  .kup-section{position:relative;z-index:1;min-height:520px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:5rem 0;border-top:1px solid rgba(243,240,230,0.06);border-bottom:1px solid rgba(243,240,230,0.06)}
  .kup-bg-text{position:absolute;top:50%;transform:translateY(-50%);font-family:'Poppins',sans-serif;font-weight:900;font-size:clamp(6rem,16vw,13rem);letter-spacing:-4px;color:rgba(243,240,230,0.06);white-space:nowrap;z-index:0;pointer-events:none;user-select:none}
  .kbt-sol{left:-2vw}
  .kbt-sag{right:-2vw}
  .kup-etiket{position:absolute;top:2.2rem;left:50%;transform:translateX(-50%);z-index:2;text-align:center}
  .kup-etiket span{font-size:0.72rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;opacity:0.4}
  .kup-etiket h2{font-family:'Poppins',sans-serif;font-size:1.5rem;font-weight:900;letter-spacing:-0.5px;margin-top:0.3rem}
  .kup-etiket h2 span{color:var(--turuncu)}
  .kup-sahne{position:relative;z-index:1;width:230px;height:230px;perspective:1100px}
  .kup{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:kupDondur 16s linear infinite}
  .kup-yuz{position:absolute;width:230px;height:230px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.6rem;font-size:2.6rem;box-shadow:0 20px 50px rgba(243,240,230,0.18);backdrop-filter:blur(4px)}
  .kup-yuz span{font-family:'Poppins',sans-serif;font-size:0.9rem;font-weight:800;letter-spacing:-0.3px;color:#F3F0E6}
  .ky-on{background:linear-gradient(150deg,rgba(196,74,26,0.16),rgba(196,74,26,0.05));border:1.5px solid rgba(196,74,26,0.3);transform:rotateY(0deg) translateZ(115px)}
  .ky-arka{background:linear-gradient(150deg,rgba(15,157,88,0.16),rgba(15,157,88,0.05));border:1.5px solid rgba(15,157,88,0.3);transform:rotateY(180deg) translateZ(115px)}
  .ky-sag{background:linear-gradient(150deg,rgba(124,58,178,0.14),rgba(124,58,178,0.04));border:1.5px solid rgba(124,58,178,0.28);transform:rotateY(90deg) translateZ(115px)}
  .ky-sol{background:linear-gradient(150deg,rgba(8,126,149,0.14),rgba(8,126,149,0.04));border:1.5px solid rgba(8,126,149,0.28);transform:rotateY(-90deg) translateZ(115px)}
  .ky-ust{background:linear-gradient(150deg,rgba(190,20,110,0.13),rgba(190,20,110,0.04));border:1.5px solid rgba(190,20,110,0.26);transform:rotateX(90deg) translateZ(115px)}
  .ky-alt{background:linear-gradient(150deg,rgba(196,74,26,0.1),rgba(15,157,88,0.06));border:1.5px solid rgba(243,240,230,0.15);transform:rotateX(-90deg) translateZ(115px)}
  @keyframes kupDondur{from{transform:rotateX(-18deg) rotateY(0deg)}to{transform:rotateX(-18deg) rotateY(360deg)}}
 
 
  /* STATS */
  .stats{position:relative;z-index:1;background:rgba(243,240,230,0.02);border-top:1px solid rgba(243,240,230,0.06);border-bottom:1px solid rgba(243,240,230,0.06);padding:2.5rem 4rem;backdrop-filter:blur(5px)}
  .stats-inner{max-width:1200px;margin:0 auto;display:flex;justify-content:space-around;text-align:center;flex-wrap:wrap;gap:1.5rem}
  .stat-num{font-family:'Poppins',sans-serif;font-size:2.8rem;font-weight:900;letter-spacing:-2px;line-height:1}
  .sn-t{color:var(--turuncu);text-shadow:0 0 20px rgba(196,74,26,0.5)}
  .sn-y{color:var(--neon-yesil);text-shadow:0 0 20px rgba(15,157,88,0.5)}
  .sn-w{color:#F3F0E6}
  .stat-label{font-size:0.82rem;font-weight:700;opacity:0.4;text-transform:uppercase;letter-spacing:1px;margin-top:0.3rem}
 
  /* SECTIONS */
  .sections{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;max-width:1200px;margin:0 auto;padding:6rem 4rem;gap:4rem}
  .sec-header{display:flex;align-items:center;gap:1rem;margin-bottom:1.8rem}
  .sec-icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.4rem}
  .si-t{background:rgba(196,74,26,0.1);border:1px solid rgba(196,74,26,0.2)}
  .si-y{background:rgba(15,157,88,0.08);border:1px solid rgba(15,157,88,0.15)}
  .sec-sub{font-size:0.72rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;opacity:0.35}
  .sec-header h2{font-family:'Poppins',sans-serif;font-size:1.7rem;font-weight:900;letter-spacing:-1px}
  .vcard{background:rgba(243,240,230,0.03);border-radius:18px;overflow:hidden;margin-bottom:1rem;border:1.5px solid rgba(243,240,230,0.07);transition:transform 0.2s,box-shadow 0.2s,border-color 0.2s;display:flex;backdrop-filter:blur(5px)}
  .vcard:hover{transform:translateX(6px)}
  .vcard-tur:hover{border-color:rgba(196,74,26,0.4);box-shadow:0 0 20px rgba(196,74,26,0.1)}
  .vcard-yes:hover{border-color:rgba(15,157,88,0.3);box-shadow:0 0 20px rgba(15,157,88,0.08)}
  .vcard-thumb{width:90px;min-width:90px;display:flex;align-items:center;justify-content:center;font-size:2rem;position:relative}
  .vt-t{background:rgba(196,74,26,0.1)}
  .vt-y{background:rgba(15,157,88,0.07)}
  .vcard-dur{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,0.7);color:#F3F0E6;font-size:0.65rem;font-weight:800;padding:0.15rem 0.4rem;border-radius:6px}
  .vcard-info{padding:1rem 1.2rem}
  .vcard-info h3{font-size:0.95rem;font-weight:800;margin-bottom:0.3rem;font-family:'Poppins',sans-serif;letter-spacing:-0.3px}
  .vcard-info p{font-size:0.8rem;opacity:0.4;font-weight:700}
  .tumu{font-weight:800;font-size:0.9rem;text-decoration:none;display:inline-flex;align-items:center;gap:0.3rem;margin-top:0.5rem;transition:gap 0.2s,text-shadow 0.2s}
  .tumu:hover{gap:0.6rem}
  .tm-t{color:var(--turuncu)}
  .tm-t:hover{text-shadow:0 0 10px rgba(196,74,26,0.5)}
  .tm-y{color:var(--neon-yesil)}
  .tm-y:hover{text-shadow:0 0 10px rgba(15,157,88,0.5)}
 
  /* MINI 360° LENS (video kartları üzerinde) */
  .vcard-thumb{position:relative;overflow:visible}
  .mini360{position:absolute;top:6px;left:6px;z-index:3}
  .mini360-frame{
    width:34px;height:34px;border-radius:9px;
    background:rgba(13,18,16,0.72);
    border:1px solid rgba(243,240,230,0.35);
    display:flex;align-items:center;justify-content:center;
    position:relative;cursor:zoom-in;
    transform-origin:top left;
    transition:transform 0.35s cubic-bezier(.2,.8,.2,1),box-shadow 0.35s,border-color 0.35s;
    overflow:hidden;
  }
  .mini360-frame:hover,.mini360-frame:focus-visible{
    transform:scale(3.1);
    box-shadow:0 10px 30px rgba(0,0,0,0.5),0 0 0 1px rgba(124,58,178,0.5),0 0 25px rgba(124,58,178,0.35);
    border-color:rgba(124,58,178,0.7);
  }
  .mini360-video{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; opacity:0; transition:opacity 0.2s;
    pointer-events:none;
  }
  .mini360-video.mv-ready{opacity:1}
  .mini360-video.mv-ready ~ .mini360-figure,
  .mini360-video.mv-ready ~ .mini360-ring{display:none}
  .mini360-figure{font-size:1rem;animation:mini360Nabız 2.4s ease-in-out infinite}
  @keyframes mini360Nabız{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  .mini360-ring{position:absolute;inset:0;animation:spin 9s linear infinite}
  .mini360-ring span{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--mor);box-shadow:0 0 5px var(--mor);top:50%;left:50%;margin:-1.5px}
  .mini360-ring span:nth-child(1){transform:rotate(0deg) translateY(-15px)}
  .mini360-ring span:nth-child(2){transform:rotate(45deg) translateY(-15px)}
  .mini360-ring span:nth-child(3){transform:rotate(90deg) translateY(-15px)}
  .mini360-ring span:nth-child(4){transform:rotate(135deg) translateY(-15px)}
  .mini360-ring span:nth-child(5){transform:rotate(180deg) translateY(-15px)}
  .mini360-ring span:nth-child(6){transform:rotate(225deg) translateY(-15px)}
  .mini360-ring span:nth-child(7){transform:rotate(270deg) translateY(-15px)}
  .mini360-ring span:nth-child(8){transform:rotate(315deg) translateY(-15px)}
  .mini360-tag{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);font-size:0.5rem;font-weight:800;letter-spacing:0.5px;color:#fff;background:var(--mor);padding:0.05rem 0.3rem;border-radius:6px;white-space:nowrap;opacity:0;transition:opacity 0.25s}
  .mini360-frame:hover .mini360-tag,.mini360-frame:focus-visible .mini360-tag{opacity:1}
  @media(prefers-reduced-motion:reduce){.mini360-figure,.mini360-ring{animation:none}}
  @media(max-width:768px){.mini360-frame:hover,.mini360-frame:focus-visible{transform:scale(2.2)}}

  /* LIFE HACK BÖLÜMÜ */
  .lifehack-section{position:relative;z-index:1;padding:6rem 4rem;border-top:1px solid rgba(243,240,230,0.06);background:rgba(124,58,178,0.05)}
  .lifehack-baslik{text-align:center;max-width:560px;margin:0 auto 3rem}
  .lifehack-baslik h2{font-family:'Poppins',sans-serif;font-size:2.2rem;font-weight:900;letter-spacing:-1px}
  .lifehack-baslik h2 span{color:var(--mor);text-shadow:0 0 15px rgba(124,58,178,0.4)}
  .lifehack-alt{color:rgba(243,240,230,0.45);font-weight:600;line-height:1.7;margin-top:0.6rem}
  .lifehack-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem;max-width:1200px;margin:0 auto}
  .lifehack-kart{background:rgba(243,240,230,0.03);border:1.5px solid rgba(124,58,178,0.2);border-radius:20px;padding:1.8rem;position:relative;backdrop-filter:blur(5px);transition:transform 0.2s,border-color 0.2s,box-shadow 0.2s}
  .lifehack-kart:hover{transform:translateY(-5px);border-color:rgba(124,58,178,0.5);box-shadow:0 0 25px rgba(124,58,178,0.18)}
  .lh-icon{font-size:1.8rem;margin-bottom:0.8rem}
  .lh-dur{position:absolute;top:1.6rem;right:1.6rem;font-size:0.7rem;font-weight:800;color:var(--mor);background:rgba(124,58,178,0.15);padding:0.2rem 0.5rem;border-radius:8px}
  .lifehack-kart h3{font-family:'Poppins',sans-serif;font-size:1rem;font-weight:800;margin-bottom:0.4rem;letter-spacing:-0.3px;color:#F3F0E6}
  .lifehack-kart p{font-size:0.85rem;color:rgba(243,240,230,0.5);font-weight:600;line-height:1.6}
  .lh-badge{display:inline-block;margin-top:0.9rem;font-size:0.68rem;font-weight:800;letter-spacing:0.5px;text-transform:uppercase;color:var(--mor);border:1px solid rgba(124,58,178,0.4);padding:0.2rem 0.6rem;border-radius:50px}

  @media(max-width:768px){
    .lifehack-section{padding:4rem 1.5rem}
    .lifehack-grid{grid-template-columns:1fr}
  }

  /* HAKKIMDA */
  .hakkimda-section {
    position: relative; z-index: 1;
    background: rgba(243,240,230,0.02);
    border-top: 1px solid rgba(243,240,230,0.06);
    padding: 6rem 4rem;
  }
  .hakkimda-inner {
    max-width: 1200px; margin: 0 auto;
    display: grid; grid-template-columns: 1fr 1.4fr;
    gap: 5rem; align-items: center;
  }
  .foto-wrap {
    position: relative;
  }
  .foto-cerceve {
    width: 100%; aspect-ratio: 3/4;

<script>
// MOBİL MENÜ
const navToggle=document.getElementById('navToggle'),navLinks=document.getElementById('navLinks');
navToggle.addEventListener('click',()=>{
  const open=navLinks.classList.toggle('open');
  navToggle.classList.toggle('open',open);
  navToggle.setAttribute('aria-expanded',open);
});
navLinks.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{
  navLinks.classList.remove('open');navToggle.classList.remove('open');navToggle.setAttribute('aria-expanded',false);
}));

// MINI 360° LENS — VİDEO OYNATMA
// data-video attribute'una video linki/yolu yazıldığında hover/focus'ta oynar; boşsa placeholder kalır.
document.querySelectorAll('.mini360').forEach(lens=>{
  const frame=lens.querySelector('.mini360-frame');
  const video=lens.querySelector('.mini360-video');
  const src=video.dataset.video;
  if(!src) return;
  const activate=()=>{
    if(video.src!==src){video.src=src;}
    video.currentTime=0;
    video.play().catch(()=>{});
    video.classList.add('mv-ready');
  };
  const deactivate=()=>{
    video.pause();
    video.classList.remove('mv-ready');
  };
  frame.addEventListener('mouseenter',activate);
  frame.addEventListener('mouseleave',deactivate);
  frame.addEventListener('focus',activate);
  frame.addEventListener('blur',deactivate);
});

// SCROLL'DA BELİRME ANİMASYONU
const revealEls=document.querySelectorAll('.sec-header, .vcard, .yorum-kart, .iletisim-kart, .hakkimda-inner, .stats-inner > div, .lifehack-kart, .lifehack-baslik, .page-header, .page-grid > *');
const revealObserver=new IntersectionObserver(entries=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      entry.target.style.animation='fadeUp 0.6s ease forwards';
      revealObserver.unobserve(entry.target);
    }
  });
},{threshold:0.15});
revealEls.forEach(el=>{el.style.opacity='0';revealObserver.observe(el);});
</script>

<!-- 3D ORGANİK DALGA ARKA PLANI (Three.js) -->
<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

const canvas = document.getElementById('particle-canvas');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.z = 20;

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

// İlk gösterilen versiyondaki palet: çoğunlukla sage yeşili, seyrek mercan vurgusu
const COUNT = 2400;
const positions = new Float32Array(COUNT * 3);
const seeds = new Float32Array(COUNT);
const colorMix = new Float32Array(COUNT);

for (let i = 0; i < COUNT; i++) {
  const i3 = i * 3;
  positions[i3]     = (Math.random() - 0.5) * 60;
  positions[i3 + 1] = (Math.random() - 0.5) * 34;
  positions[i3 + 2] = (Math.random() - 0.5) * 30;
  seeds[i] = Math.random() * Math.PI * 2;
  colorMix[i] = Math.random() > 0.88 ? 1 : 0; // ~%12 mercan vurgusu
}

const geometry = new THREE.BufferGeometry();
geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
geometry.setAttribute('colorMix', new THREE.BufferAttribute(colorMix, 1));

const sage = new THREE.Color(0xC4E86C);
const coral = new THREE.Color(0xFF7A59);

const material = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uSage: { value: sage },
    uCoral: { value: coral },
    uMouse: { value: new THREE.Vector2(0, 0) },
  },
  vertexShader: `
    uniform float uTime;
    uniform vec2 uMouse;
    attribute float seed;
    attribute float colorMix;
    varying float vColorMix;
    varying float vAlpha;

    void main() {
      vColorMix = colorMix;
      vec3 pos = position;

      // katmanlı sinüsler: nefes alan, organik bir akım hissi
      float t = uTime * 0.35 + seed;
      pos.x += sin(t + pos.y * 0.08) * 1.8;
      pos.y += cos(t * 0.8 + pos.x * 0.06) * 1.4;
      pos.z += sin(t * 0.5 + pos.x * 0.05 + pos.y * 0.05) * 2.2;

      // fareye doğru yumuşak sürüklenme
      pos.x += uMouse.x * 3.0;
      pos.y += uMouse.y * 2.0;

      vAlpha = 0.35 + 0.35 * sin(t * 1.3);

      vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
      gl_PointSize = (colorMix > 0.5 ? 3.2 : 2.0) * (28.0 / -mvPosition.z);
      gl_Position = projectionMatrix * mvPosition;
    }
  `,
  fragmentShader: `
    uniform vec3 uSage;
    uniform vec3 uCoral;
    varying float vColorMix;
    varying float vAlpha;

    void main() {
      float d = length(gl_PointCoord - vec2(0.5));
      if (d > 0.5) discard;
      float soft = smoothstep(0.5, 0.0, d);
      vec3 color = mix(uSage, uCoral, vColorMix);
      gl_FragColor = vec4(color, soft * vAlpha);
    }
  `,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
});

const points = new THREE.Points(geometry, material);
scene.add(points);

let targetMouse = { x: 0, y: 0 };
let mouse = { x: 0, y: 0 };
window.addEventListener('mousemove', (e) => {
  targetMouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  targetMouse.y = -((e.clientY / window.innerHeight) * 2 - 1);
});

const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  mouse.x += (targetMouse.x - mouse.x) * 0.02;
  mouse.y += (targetMouse.y - mouse.y) * 0.02;

  material.uniforms.uTime.value = reducedMotion ? 0 : t;
  material.uniforms.uMouse.value.set(mouse.x, mouse.y);
  points.rotation.y = reducedMotion ? 0 : Math.sin(t * 0.05) * 0.1;

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
